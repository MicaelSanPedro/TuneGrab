# JVM maior: o runner do GitHub tem 16GB; 2GB causava GC constante na compilação.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Build cache: reusa saídas de compilação (Kotlin, CMake, dex) ENTRE execuções —
# é o que faz o build da tag reaproveitar o da push do mesmo commit.
org.gradle.caching=true

# Roda tarefas independentes em paralelo (o runner tem 4 núcleos).
org.gradle.parallel=true

# Configuration cache: pula a fase de configuração do build em execuções repetidas.
org.gradle.configuration-cache=true

# Compila o Kotlin dentro do processo do Gradle (evita subir um daemon separado no CI).
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
