name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# Empilhou pushes? Cancela o run antigo e compila só o último commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico completo: as notas da release (que viram o changelog do
          # card de atualização dentro do app) são geradas do log de commits.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cacheia GRADLE_USER_HOME (dependências, wrapper e build cache).
      # O build cache do Gradle (ligado no gradle.properties) faz a tag do
      # mesmo commit reaproveitar as saídas compiladas pela push de origem.
      - name: Setup Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      # Push normal compila SÓ o release (é o que a gente instala).
      # Tag compila o debug também (vai anexado na release para depurar).
      # Sem --no-daemon: o daemon aproveita o JIT quente e o setup-gradle o encerra no fim.
      - name: Build APKs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease assembleDebug --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Upload artifact (release)
        uses: actions/upload-artifact@v4
        with:
          name: TuneGrab-APK-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload artifact (debug, só na tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: TuneGrab-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename APKs (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/TuneGrab-${VERSION}.apk"
          cp app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/TuneGrab-${VERSION}-debug.apk"

      - name: Release notes (commits desde a tag anterior)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "### Novidades"
            echo
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log --format='- %s' "${PREV}..${GITHUB_REF_NAME}"
            else
              echo "- Primeira release pública 🎉"
            fi
          } > body.md
          echo "--- body.md ---"; cat body.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} — Stable"
          body_path: body.md
          files: |
            app/build/outputs/apk/release/TuneGrab-*.apk
            app/build/outputs/apk/debug/TuneGrab-*.apk
