name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TuneGrab-APK-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename APKs (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/TuneGrab-${VERSION}.apk"
          cp app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/TuneGrab-${VERSION}-debug.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/TuneGrab-*.apk
            app/build/outputs/apk/debug/TuneGrab-*.apk
          generate_release_notes: true
